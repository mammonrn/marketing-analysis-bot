<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>สรุปผลประกอบการ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/miniapp/vendor/chart.umd.min.js"></script>
    <style>
      :root {
        /* Telegram injects these; the fallbacks keep the page readable in a
           plain browser during development. */
        --bg: var(--tg-theme-bg-color, #ffffff);
        --fg: var(--tg-theme-text-color, #1c1c1e);
        --muted: var(--tg-theme-hint-color, #8e8e93);
        --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
        --accent: var(--tg-theme-button-color, #2f6feb);
        --border: color-mix(in srgb, var(--muted) 30%, transparent);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 16px 16px 32px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun",
          "Noto Sans Thai", Roboto, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-text-size-adjust: 100%;
      }

      header { margin-bottom: 20px; }

      h1 {
        font-size: 20px;
        line-height: 1.3;
        margin: 0 0 6px;
        font-weight: 700;
      }

      .meta {
        color: var(--muted);
        font-size: 13px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
      }

      section {
        background: var(--card);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
      }

      h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 12px;
        font-weight: 600;
      }

      #summary { white-space: pre-wrap; overflow-wrap: anywhere; }
      #summary strong { font-weight: 700; }

      /* A wide chart scrolls inside its own box rather than the page. */
      .chart-scroll { overflow-x: auto; }
      .chart-box { position: relative; height: 320px; min-width: 280px; }

      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
      th { color: var(--muted); font-weight: 600; }
      tr:last-child td { border-bottom: none; }
      td.value { font-variant-numeric: tabular-nums; font-weight: 600; }

      .badge {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge.good { background: #d3f2dd; color: #12633a; }
      .badge.normal { background: #dfe6f2; color: #2b4a75; }
      .badge.warn { background: #fdeccd; color: #7a4d05; }
      .badge.critical { background: #fbd8d8; color: #7d1d1d; }

      #error {
        text-align: center;
        padding: 48px 16px;
        color: var(--muted);
      }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="error" hidden></div>

    <div id="content" hidden>
      <header>
        <h1 id="title">สรุปผลประกอบการ</h1>
        <div class="meta">
          <span id="meta-sites"></span>
          <span id="meta-turns"></span>
          <span id="meta-time"></span>
        </div>
      </header>

      <section id="summary-card">
        <h2>ภาพรวม</h2>
        <div id="summary"></div>
      </section>

      <section id="chart-card" hidden>
        <h2 id="chart-title">กราฟ</h2>
        <div class="chart-scroll">
          <div class="chart-box"><canvas id="chart"></canvas></div>
        </div>
      </section>

      <section id="metrics-card" hidden>
        <h2>ตัวเลขที่ถามในเซสชันนี้</h2>
        <table>
          <thead>
            <tr><th>Metric</th><th>ค่า</th><th>สถานะ</th></tr>
          </thead>
          <tbody id="metrics-body"></tbody>
        </table>
      </section>
    </div>

    <script src="/miniapp/assets/app.js"></script>
  </body>
</html>
