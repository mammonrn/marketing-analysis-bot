# Nginx reference config for ads-analytics-bot
#
# ⚠️ ตาม spec §2 เซิร์ฟเวอร์นี้ตั้ง Nginx + SSL (Certbot) + DNS ไว้แล้ว
#    ไฟล์นี้จึงเป็น "ค่าที่ควรเป็น" ไว้เทียบ ไม่ใช่ไฟล์ที่ต้องเอาไปวางทับ
#
#    เช็คของเดิมก่อน:
#      sudo nginx -T | grep -A30 'analytics'
#
#    ถ้ามี server block ที่ proxy ไป 127.0.0.1:3001 อยู่แล้ว → ไม่ต้องแก้อะไรเลย
#    ที่ต้องเพิ่มจริง ๆ มีแค่ location /api/summary/ กับ /miniapp (ดูด้านล่าง)
#
# โดเมนเป็น IDN: analytics.ไข่เค็มไชยา.com
# Nginx ต้องใช้ punycode ใน server_name — ใส่อักษรไทยตรง ๆ ไม่ทำงาน

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name analytics.xn--22ces5gg0h4d4ae2ai.com;

    # Certbot จัดการให้แล้ว — ปล่อยตามที่ certbot เขียนไว้ ไม่ต้องแก้
    ssl_certificate     /etc/letsencrypt/live/analytics.xn--22ces5gg0h4d4ae2ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.xn--22ces5gg0h4d4ae2ai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/analytics-access.log;
    error_log  /var/log/nginx/analytics-error.log;

    # Telegram Mini App ต้องโหลดในกรอบของ Telegram — ห้ามใส่ X-Frame-Options: DENY
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # คำถามที่ต้องเรียก Anthropic ใช้เวลาได้หลายสิบวินาที
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # payload ของ dashboard ผูกกับ token ใช้ครั้งเดียว — ห้าม cache ที่ชั้นไหนก็ตาม
    location /api/summary/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
}

# HTTP → HTTPS (ปกติ certbot ใส่ให้แล้ว)
server {
    listen 80;
    listen [::]:80;
    server_name analytics.xn--22ces5gg0h4d4ae2ai.com;
    return 301 https://$host$request_uri;
}
